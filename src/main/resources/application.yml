server:
  port: ${RAYCHI_API_PORT:8080}
  servlet:
    session:
      cookie:
        name: RAYCHI_SESSION
        http-only: true
        same-site: lax
        secure: ${RAYCHI_COOKIE_SECURE:false}
spring:
  datasource:
    url: ${RAYCHI_DB_URL:jdbc:mysql://localhost:3307/raychi?connectionTimeZone=UTC}
    username: ${RAYCHI_DB_USER:raychi}
    password: ${RAYCHI_DB_PASSWORD:}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    time-zone: UTC
raychi:
  analytics:
    enabled: ${RAYCHI_ANALYTICS_ENABLED:false}
    url: ${RAYCHI_ANALYTICS_URL:http://127.0.0.1:8093}
    app: ${RAYCHI_ANALYTICS_APP:raychi-public}
    token: ${RAYCHI_ANALYTICS_TOKEN:}
    origin: ${RAYCHI_ANALYTICS_ORIGIN:http://127.0.0.1:3000}
  agent:
    enabled: ${RAYCHI_AGENT_ENABLED:false}
    url: ${RAYCHI_AGENT_URL:http://127.0.0.1:8092}
    token: ${RAYCHI_AGENT_TOKEN:}
  search:
    enabled: ${RAYCHI_SEARCH_ENABLED:false}
    url: ${RAYCHI_SEARCH_URL:http://127.0.0.1:8091}
    namespace: ${RAYCHI_SEARCH_NAMESPACE:raychi-public}
    token: ${RAYCHI_SEARCH_TOKEN:}
    poll-ms: ${RAYCHI_SEARCH_POLL_MS:2000}
  assets:
    dir: ${RAYCHI_ASSET_DIR:./data/assets}
  admin:
    username: ${RAYCHI_ADMIN_USER:}
    password-hash: ${RAYCHI_ADMIN_PASSWORD_HASH:}
