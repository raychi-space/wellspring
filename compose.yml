services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: raychi
      POSTGRES_USER: raychi
      POSTGRES_PASSWORD: ${RAYCHI_DB_PASSWORD:?Set RAYCHI_DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - raychi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raychi -d raychi"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  raychi-postgres:
