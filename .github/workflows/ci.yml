name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: migration-test-root
          MYSQL_DATABASE: raychi_case_tags
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pmigration-test-root"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mysql -h 127.0.0.1 -uroot -pmigration-test-root -e 'CREATE DATABASE raychi_publication'
      - run: mvn -B test
        env:
          RAYCHI_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/raychi_case_tags?connectionTimeZone=UTC
          RAYCHI_TEST_MYSQL_USER: root
          RAYCHI_TEST_MYSQL_PASSWORD: migration-test-root
          RAYCHI_TEST_PUBLICATION_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/raychi_publication?connectionTimeZone=UTC
